name: CI Móvil RutaGo

on:
  push:
    branches:
      - feature-ASEG1999
      - dev
      - main
  pull_request:
    branches:
      - feature-ASEG1999
      - dev
      - main

jobs:
  verify:
    name: Typecheck y lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Usé Node 24 porque Expo SDK 58 exige Node 22.13 o superior.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar NetInfo
        run: npm run check:entorno

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Verificar lint
        run: npm run lint

      # Agregué Jest al CI para que ningún merge pase con pruebas fallidas.
      - name: Ejecutar pruebas
        run: npm test

      # Exporté el bundle web para detectar rutas e imports que tsc y lint no ven.
      - name: Exportar bundle web
        run: npx expo export --platform web --output-dir .expo-export
